# Conda environment for d-vae-hea
# GPU (CUDA 12.8 wheels):  conda env create -f environment.yml
# CPU-only:                remove the torch line below and replace it with:
#                            - --extra-index-url https://download.pytorch.org/whl/cpu
#                            - torch==2.7.0
name: d-vae-hea
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Scientific stack — versions chosen to work with torch 2.7 + modern SHAP/Numba
  - numpy=2.2
  - scipy=1.15
  - pandas=2.3
  - scikit-learn=1.6
  - matplotlib=3.10
  - seaborn=0.13
  - plotly=6
  - numba=0.61.2
  - pip
  - pip:
      # PyTorch 2.7+ CUDA 12.8 wheels are published via the official PyTorch index.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.0
      # pyro-ppl is most reliably installed via pip; Pyro 1.9.1 requires torch >=2.0.
      - pyro-ppl==1.9.1
      # SHAP 0.48 has wheels for Python 3.11 and works with recent NumPy/Numba.
      - shap==0.48.0
